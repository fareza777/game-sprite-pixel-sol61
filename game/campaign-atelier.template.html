<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vespergrave · Character Atelier</title><style>html{background:#0c1420;color:#d6c5a5;font-family:Georgia,serif}body{max-width:1000px;margin:auto;padding:35px 25px}h1{font-weight:400;letter-spacing:4px}p{font:13px/1.8 system-ui,sans-serif;color:#9aaea9}nav{display:flex;gap:14px;flex-wrap:wrap}select,button{background:#1a2834;border:1px solid #726347;color:#d8c69e;padding:12px;font:13px Georgia,serif;max-width:100%}canvas{display:block;image-rendering:pixelated;width:min(95%,640px);height:auto;margin:20px auto;border:1px solid #35454f;background:repeating-linear-gradient(45deg,#172331 0 16px,#15212d 16px 32px)}a{color:#cab07c}.details{border-top:1px solid #514937;padding-top:15px}</style></head><body><p>HAND-AUTHORED PIXEL ART · MCP ASEPRITE</p><h1>THE FORGOTTEN SOULS</h1><p>Inspect every hero and enemy, with four facings and the authored timing of each animation. Heads and bodies have been checked individually in 540 key poses.</p><nav><select id="actor" aria-label="Character"></select><select id="motion" aria-label="Animation"></select><select id="facing" aria-label="Direction"><option value="s">Front</option><option value="n">Back</option><option value="e">Right</option><option value="w">Left</option></select><button id="pause">Pause</button></nav><canvas id="preview" width="240" height="180" aria-label="Animated character preview"></canvas><p class="details" id="details"></p><p><a href="/">Return to Vespergrave</a></p><script>const ASSETS=__ASSETS__,CAST=__CAST__,actor=document.getElementById('actor'),motion=document.getElementById('motion'),facing=document.getElementById('facing'),canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let img=new Image(),asset=null,clock=0,paused=false,last=0;actor.innerHTML=CAST.map(c=>`<option value="${c.asset}">${c.name}</option>`).join('');function load(){asset=ASSETS[actor.value];img=new Image();img.src=asset.image;motion.innerHTML=asset.meta.frameTags.filter(t=>t.name.startsWith('s-')).map(t=>`<option>${t.name.slice(2)}</option>`).join('');clock=0;document.getElementById('details').textContent=CAST.find(c=>c.asset===actor.value).name+' · '+Object.keys(asset.frames).length+' frames · Native foot anchor '+asset.meta.anchor.x+', '+asset.meta.anchor.y+' · Art revision '+asset.meta.artRevision;}actor.onchange=load;motion.onchange=facing.onchange=()=>clock=0;document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};function tick(t){requestAnimationFrame(tick);if(!paused)clock+=(t-(last||t));last=t;ctx.clearRect(0,0,240,180);if(!img.complete||!asset)return;const tag=asset.meta.frameTags.find(x=>x.name===facing.value+'-'+motion.value),frames=Object.values(asset.frames),total=frames.slice(tag.from,tag.to+1).reduce((n,f)=>n+f.duration,0);let time=clock%total,index=tag.to;for(let n=tag.from;n<=tag.to;n++){time-=frames[n].duration;if(time<0){index=n;break;}}const f=frames[index].frame,a=asset.meta.anchor;ctx.fillStyle='#08111bbb';ctx.beginPath();ctx.ellipse(120,148,23,7,0,0,Math.PI*2);ctx.fill();ctx.drawImage(img,f.x,f.y,f.w,f.h,120-a.x,148-a.y,f.w,f.h);}load();requestAnimationFrame(tick);</script></body></html>
