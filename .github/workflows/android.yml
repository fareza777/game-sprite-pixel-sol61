name: Verify game and build Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify the game
        run: npm run build && npm test && npm run android:sync
      - name: Build installable debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CinderVow-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
